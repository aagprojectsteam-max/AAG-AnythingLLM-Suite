name: ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Package and publication gates
        run: ./doctor.sh --package
      - name: Portable Golden regressions
        run: >-
          node --test
          image-system/tests/inline-composer-integration.test.js
          image-system/tests/image-composer-mode.test.js
          image-system/tests/expert-prompt-preference.test.js
          image-system/tests/job-index.test.js
          image-system/tests/generated-image-cleanup.test.js
          image-system/tests/artifact-naming.test.js
          image-system/tests/artifact-result-text.test.js
          image-system/tests/artifact-presentation.test.js
          image-system/tests/progress-persistence.test.js
          image-system/tests/live-artifact-completion.test.js
          image-system/tests/thread-numbering.test.js
      # Full Atlas and Expert integration suites additionally require the
      # authorized external pixels and offline tokenizer, excluded from Git.
      # Their Golden closure results are recorded in the release documentation.
